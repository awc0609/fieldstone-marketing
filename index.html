    <h2>Frequently asked questions</h2>
    <div class="faq-item" onclick="toggleFaq(this)">
      <div class="faq-question">Do I need technical expertise to set up Fieldstone? <span class="faq-chevron">›</span></div>
      <div class="faq-answer">Your IT consultant or a technically inclined principal can handle the initial Azure deployment — it takes about 15 minutes. After that, the office manager can run Fieldstone day-to-day with no technical knowledge required.</div>
    </div>
    <div class="faq-item" onclick="toggleFaq(this)">
      <div class="faq-question">Do I need an Azure subscription? <span class="faq-chevron">›</span></div>
      <div class="faq-answer">Yes — Fieldstone deploys into your firm's Azure environment. If you use Microsoft 365, you likely already have an Azure subscription. If not, Azure has a free tier that covers the initial setup, and ongoing costs are typically under $20/month for a small firm.</div>
    </div>
    <div class="faq-item" onclick="toggleFaq(this)">
      <div class="faq-question">What systems can Fieldstone connect to? <span class="faq-chevron">›</span></div>
      <div class="faq-answer">The current connector library includes Microsoft 365 (SharePoint, Exchange), Microsoft Entra ID, Dropbox Business, AWS S3, Autodesk, Bluebeam Revu, and Veeam. New connectors are added regularly and delivered as free updates.</div>
    </div>
    <div class="faq-item" onclick="toggleFaq(this)">
      <div class="faq-question">Where is our data stored? <span class="faq-chevron">›</span></div>
      <div class="faq-answer">All data stays within your Azure environment. Fieldstone never sends your storage figures, credentials, or client information to our servers. Your license key is validated once at setup and then works offline forever.</div>
    </div>
    <div class="faq-item" onclick="toggleFaq(this)">
      <div class="faq-question">What does "one-time purchase" mean exactly? <span class="faq-chevron">›</span></div>
