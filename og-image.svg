  <text x="904" y="316" font-family="Inter, sans-serif" font-size="9" fill="#d97706" text-anchor="end">74%</text>
  <rect x="752" y="320" width="152" height="4" rx="2" fill="#2a2a2a"/>
  <rect x="752" y="320" width="112" height="4" rx="2" fill="#d97706"/>

