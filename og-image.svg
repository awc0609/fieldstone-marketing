  <circle cx="944" cy="298" r="3" fill="#d97706"/>
  <text x="952" y="302" font-family="Inter, sans-serif" font-size="9" fill="#999999">SSL expires in 18 days</text>

  <circle cx="944" cy="322" r="3" fill="#16a34a"/>
  <text x="952" y="326" font-family="Inter, sans-serif" font-size="9" fill="#999999">All devices patched</text>

