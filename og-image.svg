  <rect x="1076" y="410" width="28" height="14" rx="3" fill="#3d0000"/>
  <text x="1090" y="421" font-family="Inter, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">3</text>

  <circle cx="752" cy="440" r="3" fill="#dc2626"/>
  <text x="762" y="444" font-family="Inter, sans-serif" font-size="9" fill="#999999">Autodesk Revit (5 seats)</text>
  <text x="1104" y="444" font-family="Inter, sans-serif" font-size="9" fill="#dc2626" text-anchor="end">18 days</text>

  <circle cx="752" cy="462" r="3" fill="#d97706"/>
  <text x="762" y="466" font-family="Inter, sans-serif" font-size="9" fill="#999999">Adobe CC (3 seats)</text>
  <text x="1104" y="466" font-family="Inter, sans-serif" font-size="9" fill="#d97706" text-anchor="end">41 days</text>

  <circle cx="752" cy="484" r="3" fill="#d97706"/>
  <text x="762" y="488" font-family="Inter, sans-serif" font-size="9" fill="#999999">Bluebeam Revu (2 seats)</text>
  <text x="1104" y="488" font-family="Inter, sans-serif" font-size="9" fill="#d97706" text-anchor="end">55 days</text>

  <circle cx="752" cy="506" r="3" fill="#16a34a"/>
  <text x="762" y="510" font-family="Inter, sans-serif" font-size="9" fill="#666666">Microsoft 365 Business</text>
  <text x="1104" y="510" font-family="Inter, sans-serif" font-size="9" fill="#16a34a" text-anchor="end">335 days</text>

  <!-- Bottom tag -->
  <text x="80" y="580" font-family="Inter, sans-serif" font-size="16" fill="#333333">fieldstone-app.com · One-time purchase · Self-hosted</text>
