  <rect x="736" y="220" width="180" height="160" rx="6" fill="#1d1d1d"/>
  <text x="752" y="242" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#ffffff">Storage</text>
  <rect x="916" y="234" width="40" height="14" rx="3" fill="#3d2e00"/>
  <text x="936" y="245" font-family="Inter, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">Attention</text>

  <text x="752" y="268" font-family="Inter, sans-serif" font-size="9" fill="#666666">SharePoint</text>
  <text x="904" y="268" font-family="Inter, sans-serif" font-size="9" fill="#dc2626" text-anchor="end">91%</text>
  <rect x="752" y="272" width="152" height="4" rx="2" fill="#2a2a2a"/>
  <rect x="752" y="272" width="138" height="4" rx="2" fill="#dc2626"/>

  <text x="752" y="292" font-family="Inter, sans-serif" font-size="9" fill="#666666">Dropbox</text>
  <text x="904" y="292" font-family="Inter, sans-serif" font-size="9" fill="#16a34a" text-anchor="end">62%</text>
  <rect x="752" y="296" width="152" height="4" rx="2" fill="#2a2a2a"/>
  <rect x="752" y="296" width="94" height="4" rx="2" fill="#16a34a"/>

