<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111111"/>
  
  <!-- Subtle grid pattern -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Stone mark — large -->
  <rect x="80" y="180" width="120" height="22" rx="5" fill="#ffffff"/>
  <rect x="68" y="208" width="144" height="22" rx="5" fill="#ffffff" opacity="0.7"/>
  <rect x="80" y="236" width="100" height="22" rx="5" fill="#ffffff" opacity="0.45"/>
  <rect x="64" y="264" width="136" height="22" rx="5" fill="#ffffff" opacity="0.22"/>

  <!-- Wordmark -->
  <text x="80" y="360" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="500" fill="#ffffff" letter-spacing="-2">Fieldstone</text>
  <text x="83" y="400" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#555555" letter-spacing="6">RISK CONSOLE</text>

  <!-- Tagline -->
  <text x="80" y="480" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#888888">Know your firm's risks before they become problems.</text>

  <!-- Right side — mini dashboard preview -->
  <rect x="720" y="80" width="420" height="480" rx="12" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Dashboard top bar -->
  <rect x="720" y="80" width="420" height="48" rx="12" fill="#1f1f1f"/>
  <rect x="720" y="104" width="420" height="24" fill="#1f1f1f"/>
  <circle cx="748" cy="104" r="6" fill="#333333"/>
  <circle cx="768" cy="104" r="6" fill="#333333"/>
  <circle cx="788" cy="104" r="6" fill="#333333"/>

  <!-- Metric cards -->
  <rect x="736" y="148" width="74" height="56" rx="6" fill="#252525"/>
  <text x="773" y="170" font-family="Inter, sans-serif" font-size="9" fill="#666666" text-anchor="middle">STORAGE</text>
  <text x="773" y="190" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#d97706" text-anchor="middle">78%</text>

  <rect x="818" y="148" width="74" height="56" rx="6" fill="#252525"/>
  <text x="855" y="170" font-family="Inter, sans-serif" font-size="9" fill="#666666" text-anchor="middle">SECURITY</text>
  <text x="855" y="190" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#d97706" text-anchor="middle">B+</text>

  <rect x="900" y="148" width="74" height="56" rx="6" fill="#252525"/>
  <text x="937" y="170" font-family="Inter, sans-serif" font-size="9" fill="#666666" text-anchor="middle">BACKUPS</text>
  <text x="937" y="190" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#16a34a" text-anchor="middle">92%</text>

  <rect x="982" y="148" width="74" height="56" rx="6" fill="#252525"/>
  <text x="1019" y="170" font-family="Inter, sans-serif" font-size="9" fill="#666666" text-anchor="middle">LICENSES</text>
  <text x="1019" y="190" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#dc2626" text-anchor="middle">3</text>

