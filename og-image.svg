  <rect x="924" y="220" width="196" height="160" rx="6" fill="#1d1d1d"/>
  <text x="940" y="242" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#ffffff">Security</text>

  <circle cx="944" cy="268" r="3" fill="#dc2626"/>
  <text x="952" y="272" font-family="Inter, sans-serif" font-size="9" fill="#999999">MFA not enforced</text>
